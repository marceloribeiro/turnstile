<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7fb0dd"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="540" rx="14" fill="#0d1016"/>

  <!-- vertical connectors (spine at x=300) -->
  <g stroke="#7fb0dd" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="300" y1="72"  x2="300" y2="126"/>
    <line x1="300" y1="228" x2="300" y2="282"/>
    <line x1="300" y1="384" x2="300" y2="438"/>
  </g>
  <g fill="#9aa3b2" font-size="11.5">
    <text x="314" y="103">base-URL swap — no SDK, no code changes</text>
    <text x="314" y="259">hashed aggregates · ingest key (never raw prompts/keys)</text>
    <text x="314" y="415">REST + WebSocket (JWT)</text>
  </g>

  <!-- horizontal connectors (right side) -->
  <g stroke="#7fb0dd" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="450" y1="178" x2="556" y2="178"/>
    <line x1="450" y1="322" x2="556" y2="313"/>
    <line x1="450" y1="350" x2="556" y2="359"/>
  </g>
  <g fill="#9aa3b2" font-size="11">
    <text x="503" y="170" text-anchor="middle">forwards</text>
    <text x="503" y="305" text-anchor="middle">owns</text>
    <text x="503" y="384" text-anchor="middle">pub/sub</text>
  </g>

  <!-- Your application -->
  <rect x="150" y="20" width="300" height="52" rx="10" fill="#161b24" stroke="#2a3340"/>
  <text x="300" y="42" text-anchor="middle" fill="#e6e9ef" font-size="15" font-weight="600">Your application</text>
  <text x="300" y="60" text-anchor="middle" fill="#9aa3b2" font-size="11.5">any OpenAI-compatible client</text>

  <!-- Turnstile data plane (accent — the hero) -->
  <rect x="150" y="130" width="300" height="98" rx="10" fill="#141b26" stroke="#7fb0dd" stroke-width="1.5"/>
  <text x="300" y="162" text-anchor="middle" fill="#e6e9ef" font-size="15.5" font-weight="700">Turnstile data plane</text>
  <text x="300" y="184" text-anchor="middle" fill="#7fb0dd" font-size="12" font-family="ui-monospace, monospace">Go · :8080</text>
  <text x="300" y="206" text-anchor="middle" fill="#9aa3b2" font-size="11.5">proxy · session metering · enforcement</text>

  <!-- LLM provider -->
  <rect x="556" y="150" width="288" height="56" rx="10" fill="#161b24" stroke="#2a3340"/>
  <text x="700" y="174" text-anchor="middle" fill="#e6e9ef" font-size="14.5" font-weight="600">LLM provider</text>
  <text x="700" y="192" text-anchor="middle" fill="#9aa3b2" font-size="11.5">OpenRouter, OpenAI, Anthropic, …</text>

  <!-- Control plane -->
  <rect x="150" y="286" width="300" height="98" rx="10" fill="#141b26" stroke="#7fb0dd" stroke-width="1.5"/>
  <text x="300" y="318" text-anchor="middle" fill="#e6e9ef" font-size="15.5" font-weight="700">Control plane</text>
  <text x="300" y="340" text-anchor="middle" fill="#7fb0dd" font-size="12" font-family="ui-monospace, monospace">FastAPI · :8000</text>
  <text x="300" y="362" text-anchor="middle" fill="#9aa3b2" font-size="11.5">auth · orgs · ingest · read API</text>

  <!-- Postgres + Redis -->
  <rect x="556" y="294" width="288" height="40" rx="9" fill="#161b24" stroke="#2a3340"/>
  <text x="700" y="319" text-anchor="middle" fill="#e6e9ef" font-size="13" font-weight="600">PostgreSQL</text>
  <rect x="556" y="340" width="288" height="40" rx="9" fill="#161b24" stroke="#2a3340"/>
  <text x="700" y="365" text-anchor="middle" fill="#e6e9ef" font-size="13" font-weight="600">Redis</text>

  <!-- Dashboard -->
  <rect x="150" y="442" width="300" height="66" rx="10" fill="#161b24" stroke="#2a3340"/>
  <text x="300" y="470" text-anchor="middle" fill="#e6e9ef" font-size="15" font-weight="600">Dashboard</text>
  <text x="300" y="489" text-anchor="middle" fill="#7fb0dd" font-size="12" font-family="ui-monospace, monospace">Next.js · :3000</text>
  <text x="300" y="503" text-anchor="middle" fill="#9aa3b2" font-size="10.5">live spend · dollars prevented</text>
</svg>
