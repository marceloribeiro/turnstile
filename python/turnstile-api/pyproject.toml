[project]
name = "turnstile-api"
version = "0.1.0"
description = "Turnstile platform API — auth, organizations, projects, deployments, and telemetry ingest/read."
requires-python = ">=3.13"

[tool.ruff]
target-version = "py313"
line-length = 100
# Alembic revisions are autogenerated boilerplate; don't lint them.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "W",   # pycodestyle warnings
]
# B008: calling Depends()/Header()/Query() in argument defaults is the standard
# FastAPI dependency-injection idiom, not a bug.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Tests favour terse helpers and inline imports.
"tests/*" = ["E501", "SIM117"]
# main.py imports the OpenAPI helpers after app creation (documented E402).
"app/main.py" = ["E402"]

[tool.mypy]
python_version = "3.13"
files = ["app"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
